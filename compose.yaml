# Local stack to try the whole service before deploying: the same image that
# runs in production, plus a Postgres with the same migrations as Supabase.
#
#   docker compose up -d --build   API on http://localhost:8089/docs
#   docker compose up -d api       apply .env changes (e.g. LLM_PROVIDER) to the API
#   docker compose down -v         stop and wipe the local database
#
# Ports come from API_PORT and DB_PORT (shell or .env); the defaults are 8089
# and 5433. API_PORT is also the port uvicorn listens on inside the container,
# the same way Render sets PORT; Postgres always listens on 5432 inside.
#
# LLM_PROVIDER, LLM_MODEL, the rate limits and GEMINI_API_KEY come from .env. With
# LLM_PROVIDER=replay (the default) no model is called: the hand-annotated
# facts in tests/fixtures are served, so audits are complete without a key or
# quota. With gemini, every audit uses quota.

name: callaudit

services:
  db:
    image: postgres:17-alpine
    environment:
      # Local development credentials only; never used in production.
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      # Runs the migrations on the first start of an empty volume.
      - ./supabase/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: .
    ports:
      - "127.0.0.1:${API_PORT:-8089}:${API_PORT:-8089}"
    environment:
      PORT: ${API_PORT:-8089}
      LLM_PROVIDER: ${LLM_PROVIDER:-replay}
      LLM_MODEL: ${LLM_MODEL:-gemini-3.8-flash}
      LLM_REQUESTS_PER_MINUTE: ${LLM_REQUESTS_PER_MINUTE:-4}
      LLM_MAX_CONCURRENCY: ${LLM_MAX_CONCURRENCY:-2}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      REPLAY_FACTS_PATH: /app/dev/golden_facts.json
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/postgres
    volumes:
      - ./tests/fixtures/golden_facts.json:/app/dev/golden_facts.json:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
