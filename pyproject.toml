[project]
name = "callaudit"
version = "0.1.0"
description = "Servicio de auditoria automatica de llamadas de cobranza contra una rubrica basada en las reglas del agente."
authors = [
    { name = "Sebastian Salazar", email = "ssalazar@lynks.com.co" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "google-genai>=2.25.0",
    "httpx>=0.28.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "PT",   # flake8-pytest-style
    "RET",  # flake8-return
    "ARG",  # flake8-unused-arguments
    "PL",   # pylint
    "RUF",  # ruff-specific
]
ignore = [
    "PLR2004",  # magic values are expected in tests and in rule thresholds
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0913"]
# Test doubles implement the ports and may ignore some arguments.
"tests/fakes.py" = ["ARG002"]
# Implements the StructuredLanguageModel port: the signature is fixed even
# though a disabled model ignores its arguments.
"src/callaudit/adapters/llm/disabled.py" = ["ARG002"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
mypy_path = "src"

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
