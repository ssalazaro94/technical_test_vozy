# Render Blueprint: the production web service, described as code.
#
# The image is built from the same Dockerfile used locally. Render injects PORT
# and terminates TLS. Secrets are declared with `sync: false`: Render asks for
# them in the dashboard when the Blueprint is created, and they never live in
# this repository.

services:
  - type: web
    name: callaudit
    runtime: docker
    plan: free
    # Same region as the Supabase project (us-east-1), to keep database
    # round trips short.
    region: virginia
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-3.8-flash
      # Paid tier limits for gemini-3.8-flash in this project: 1,000 requests per
      # minute, 2M tokens per minute, 10,000 per day. Speed does not change cost;
      # spending is capped by LLM_DAILY_CALL_BUDGET below.
      - key: LLM_REQUESTS_PER_MINUTE
        value: "60"
      - key: LLM_MAX_CONCURRENCY
        value: "4"
      # Spending guards for a public API with a paid key: at most 100 model calls
      # per UTC day (about USD 1.1 with gemini-3.8-flash) and 30 audit requests
      # per hour per client IP.
      - key: LLM_DAILY_CALL_BUDGET
        value: "100"
      - key: CLIENT_REQUESTS_PER_HOUR
        value: "30"
      - key: GEMINI_API_KEY
        sync: false
      # Supabase pooler, session mode (port 5432): the free plan only has
      # IPv4 egress and the direct database host is IPv6-only.
      - key: DATABASE_URL
        sync: false
